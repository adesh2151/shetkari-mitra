name: Build Android APK

# Builds automatically on every push to master, and can also be run manually.
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web build into Android
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ShetkariMitra.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shetkari-mitra-debug-apk
          path: ShetkariMitra.apk
          if-no-files-found: error

      # Publish to a fixed "apk" release so the web app has a stable download URL:
      # https://github.com/adesh2151/shetkari-mitra/releases/download/apk/ShetkariMitra.apk
      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk ShetkariMitra.apk \
            --title "Shetkari Mitra — Android APK" \
            --notes "Latest auto-built Android app. Download ShetkariMitra.apk below and install on your phone (allow install from unknown sources)."
