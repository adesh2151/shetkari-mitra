name: Update farmer news

on:
  schedule:
    - cron: "30 1,7,13 * * *"   # ~07:00, 13:00, 19:00 IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scraper/requirements.txt

      - name: Scrape news + GRs
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scraper/news_scrape.py

      - name: Commit updated news
        run: |
          git config user.name  "shetmitra-bot"
          git config user.email "bot@users.noreply.github.com"
          git add public/news.json
          git commit -m "chore: update news feed" || echo "no changes"
          git push
